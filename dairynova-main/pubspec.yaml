name: dairy_nova_app
description: "A new Flutter project for Dairy Nova application."
publish_to: 'none'
version: 0.1.0

environment:
  sdk: '>=3.10.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  
  # Firebase
  firebase_core: ^4.4.0
  firebase_auth: ^6.1.4
  cloud_firestore: ^6.1.2

  # Networking & Media
  http: ^1.1.0
  image_picker: ^1.0.4
  
  # State Management
  provider: ^6.1.1
  
  # PDF & Printing
  pdf: ^3.10.4
  printing: ^5.12.0
  
  # Utilities
  url_launcher: ^6.2.1
  intl: ^0.18.1
  table_calendar: ^3.0.9
  path_provider: ^2.1.1
  
  # Map & Location (Fixed for compatibility)
  flutter_map: ^6.1.0
  latlong2: ^0.9.0
  location: ^5.0.3
  geolocator: ^10.1.0
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^2.0.0
  mockito: ^5.4.4
  build_runner: ^2.4.7

flutter:
  uses-material-design: true
  assets:
    - assets/images/logo.png